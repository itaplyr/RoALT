[package]
name = "roalt"
version = "1.3.0"
description = "Local-only Roblox account manager"
authors = ["inspectsoftware"]
license = "MIT"
edition = "2024"
rust-version = "1.95"

[features]
# Tauri uses the embedded frontend in release builds; `tauri dev` uses devUrl instead.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# unstable: child webviews (`Window::add_child`), for Roblox inside the RoALT window (`browse`).
tauri = { version = "2.12", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.6"
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", features = ["zeroize"] }
getrandom = "0.4"
zeroize = { version = "1.9", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
# Linux self-update (`self_update_linux`) and the Linux DPAPI substitute (`vault::dpapi_linux`).
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
# Mod packs (`mods::pack`): deflate only, read and written. 2.3+ fixed a symlink traversal in `extract`, which RoALT never calls.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Networking_NetworkListManager",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  # GetThreadContext / RtlVirtualUnwind (the watchdog's stack of a stuck main thread).
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Power",
  "Win32_System_Registry",
  # Windows locking (`session`).
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Security_Credentials_UI",
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
] }
windows-future = "0.3"
webview2-com = "0.39"

# Line numbers in backtraces, no variable info in the debugger: keeps target\debug small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind so a background thread panic logs and recovers instead of aborting every running supervision loop.
panic = "unwind"
strip = true
